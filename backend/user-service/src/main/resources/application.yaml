server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/event-sync}
    username: ${DB_USERNAME:event-sync}
    password: ${DB_PASSWORD:9ffb5a8eb7e93dafa2e197fba357160e4788ef2c40b5e6816f3f54eae376d1e7}
